services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    volumes:
      - jarvis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jarvis-api:
    image: jarvis-api:latest
    container_name: jarvis-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Host namespaces so the admin terminal and disk view see the OCI VM,
    # not only the container. Admin JWT is the gate for /admin/host/exec.
    # AppArmor's docker-default profile blocks opening /proc/1/ns/*, which
    # makes nsenter fail with "Permission denied" even as root.
    pid: host
    user: "0:0"
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-jarvis_api=info,tower_http=info}
      JARVIS_HOST_EXEC: host
    volumes:
      - /:/host/root:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  jarvis_pg_data:
