[package]
name = "jarvis-api"
version = "0.2.0"
edition = "2024"

[features]
default = ["db-sqlite"]
db-sqlite = ["sqlx/sqlite"]
db-postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring"]

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "migrate", "uuid", "chrono", "macros"] }
thiserror = "2"
sysinfo = "0.39.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
